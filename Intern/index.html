  <script>
    (function () {
      var saved = localStorage.getItem('portfolio-theme');
      var theme = saved;
      if (!theme) {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
